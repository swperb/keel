name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Build
        run: cargo build --release
      - name: Test
        run: ./tests/run.sh
