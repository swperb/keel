name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pin the solver: verdicts are deterministic for a given Z3 version,
      # and the distribution package (4.8.12 on Ubuntu 24.04) is too old
      # for some of the suite's proofs.
      - name: Install z3
        run: |
          v=5.3.2
          curl -sSfL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-$v/z3-$v-x64-glibc-2.39.zip"
          unzip -q z3.zip
          echo "$PWD/z3-$v-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
      - name: Show z3 version
        run: z3 --version
      - name: Build
        run: cargo build --release
      - name: Test
        run: ./tests/run.sh
