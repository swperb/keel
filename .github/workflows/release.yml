name: release
# Push a tag like v0.1.0 to build keel for macOS and Linux and attach the
# binaries to a GitHub release of that name.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Smoke test
        run: ./target/release/keel explain V-OVERFLOW
      - name: Package
        run: |
          name=keel-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/release/keel README.md LICENSE LICENSING.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: keel-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" keel-*.tar.gz keel-*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Keel $GITHUB_REF_NAME" --generate-notes
